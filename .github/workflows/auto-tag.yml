name: Auto Tag

# Fires on every push to main. If VERSION changed and that version is not
# already tagged, creates and pushes the tag — which in turn triggers release.yml.

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    # These workflows are authored in the private KeyHarbour/cli repo and reach
    # this repo through sync-public.sh, so the files exist in both places but
    # must only ever execute here. On the private repo auto-tag would tag main
    # the moment VERSION changes — recreating the phantom tags cleaned up in
    # September 2026 — and release would run GoReleaser against a repo with no
    # release secrets. Private-side tagging is handled by tag-released-version.yml,
    # which runs only after a release is actually published here.
    if: github.repository == 'KeyHarbour/kh'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Read version
        id: version
        run: echo "value=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.value }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"
          echo "Tagged ${{ steps.version.outputs.value }}"

      - name: Skip (tag already exists)
        if: steps.check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.value }} already exists — skipping."
